# XcodeGen spec — the Xcode project is generated from this file in CI, so no
# fragile .xcodeproj is committed. Regenerate locally with:  xcodegen generate
#
# RENAME THE APP (one place drives everything):
#   1. Change `name:` below to your app name (used for the scheme, .xcodeproj,
#      product, and IPA file — the CI workflows read it automatically).
#   2. Update PRODUCT_BUNDLE_IDENTIFIER + INFOPLIST_KEY_CFBundleDisplayName.
#   3. Rename the test target (e.g. AppNameTests) and its bundle id to match.
#   4. Optionally rename Sources/App/AppNameApp.swift's `struct AppNameApp`.
name: BeaconProject

options:
  bundleIdPrefix: com.beacon_project
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Unsigned build — signing is done on-device by the sideloading tool.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BeaconProject:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beacon_project
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "BeaconProject"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Localization is required."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

  BeaconProjectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeaconProject
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beacon_project.test
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BeaconProject:
    build:
      targets:
        BeaconProject: all
        BeaconProjectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeaconProjectTests
    archive:
      config: Release
